# Initial Nginx Configuration (before SSL certificate is available)
# Variables: DOMAIN_NAME (will be substituted by envsubst)

server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN_NAME};

    # Allow Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Temporary: Allow access for initial setup
    # Will be replaced by nginx.conf after SSL setup
    location / {
        return 503 "SSL certificate setup in progress. Please wait...";
    }
}