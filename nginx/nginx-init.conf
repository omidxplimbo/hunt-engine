# Initial Nginx Configuration (before SSL certificate is available)
# Variables: DOMAIN_NAME (will be substituted by envsubst)

# Map to detect if host is an IP address
map $host $is_ip_address {
    default 0;
    ~^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ 1;
    ~^\[.*\]$ 1;
}

# Map to check if client IP matches server IP (for IP-based access control)
# Variables: SERVER_IP (will be substituted by envsubst)
map $remote_addr $is_server_ip {
    default 0;
    ${SERVER_IP} 1;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

# Upstream definitions
upstream backend {
    server backend:8080;
}

upstream frontend {
    server frontend:80;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Allow Let's Encrypt challenge (always, even before SSL is ready)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security check: Set variable to deny IP access if client IP != server IP
    set $deny_ip_access 0;
    if ($is_ip_address = 1) {
        set $deny_ip_access "${deny_ip_access}1";
    }
    if ($is_server_ip = 0) {
        set $deny_ip_access "${deny_ip_access}1";
    }

    # Deny access if trying to access via IP from external IP
    if ($deny_ip_access = "011") {
        return 403 "شما دسترسی ندارید. لطفاً از طریق دامنه وارد شوید.\nAccess Denied. Please use the domain name to access the site.";
    }

    # Frontend (React App)
    location / {
        # For domain access (non-IP), show setup message.
        # Note: ACME challenge is excluded by the ^~ location above.
        if ($is_ip_address = 0) {
            return 503 "SSL certificate setup in progress. Please access via IP address for now.";
        }

        # If we reach here, it means access is via IP AND client IP = server IP
        limit_req zone=general_limit burst=20 nodelay;
        
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api {
        # For domain access (non-IP), show setup message.
        # Note: ACME challenge is excluded by the ^~ location above.
        if ($is_ip_address = 0) {
            return 503 "SSL certificate setup in progress. Please access via IP address for now.";
        }

        limit_req zone=api_limit burst=10 nodelay;
        
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        add_header Access-Control-Allow-Origin "$http_origin" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check endpoint (always accessible)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}