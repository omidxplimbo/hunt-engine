services:
  # -----------------------------
  # 1. Backend API (Golang Engine)
  # -----------------------------
  backend:
    container_name: hunt-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports removed - only accessible through nginx reverse proxy
    expose:
      - "8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=hunter
      - DB_PASSWORD=secretpassword
      - DB_NAME=huntdb
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PROBE_BATCH_SIZE=1000
      - TRUSTED_RESOLVERS=1.1.1.1,8.8.8.8,1.0.0.1,8.8.4.4
      # تنظیمات تلگرام (مقادیر خودت را جایگزین کردی که عالیه)
      - TELEGRAM_BOT_TOKEN=8186397853:AAGbnh2A5AnGgju9qobtL5joh9G8SSEYGV8
      - TELEGRAM_CHAT_ID=-1003320492297
    volumes:
      # 👇 این خط برای وردلیست‌های سفارشی اضافه شد (برای آینده)
      - ./custom_wordlists:/wordlists/custom
      # 👇 persist worker temp workspace for crash-safe resume
      - hunt_workspaces:/tmp/hunt-engine
      # 👇 Access Docker Socket for System Logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 2. Frontend Dashboard (React/Modern UI)
  # -----------------------------
  frontend:
    container_name: hunt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Dynamic API URL based on domain
        - VITE_API_URL=https://${DOMAIN_NAME:-localhost}/api
    # Ports removed - only accessible through nginx reverse proxy
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 3. Nginx Reverse Proxy with SSL
  # -----------------------------
  nginx:
    container_name: hunt-nginx
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx-init.conf:/etc/nginx/templates/init.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP:-109.248.160.151}
    command: >
      sh -c "
      if [ -z \"$$SERVER_IP\" ]; then
        export SERVER_IP=109.248.160.151;
      fi;
      if [ -f /etc/letsencrypt/live/$${DOMAIN_NAME:-localhost}/fullchain.pem ]; then
        envsubst '$$DOMAIN_NAME $$SERVER_IP' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && echo 'Using SSL configuration';
      else
        envsubst '$$DOMAIN_NAME $$SERVER_IP' < /etc/nginx/templates/init.conf.template > /etc/nginx/conf.d/default.conf && echo 'Using initial configuration (SSL not yet set up)';
      fi && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - backend
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 4. DNS Server (BIND9) - Your Own DNS Server
  # -----------------------------
  dns:
    container_name: hunt-dns
    build:
      context: ./dns
      dockerfile: Dockerfile
    # Use host network mode to avoid port 53 conflict with systemd-resolved
    network_mode: "host"
    volumes:
      - ./dns/zones:/etc/bind/zones
      - ./dns/logs:/var/log/named
      - dns_cache:/var/cache/bind
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP:-109.248.160.151}
    restart: unless-stopped
    # Note: When using host network mode, we can't use docker networks
    # but DNS server will be directly accessible on host IP

  # -----------------------------
  # 5. Certbot for SSL Certificate Management
  # -----------------------------
  certbot:
    container_name: hunt-certbot
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 6. Databases & Cache
  # -----------------------------
  postgres:
    container_name: hunt-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: huntdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hunt-net
    restart: unless-stopped

  redis:
    container_name: hunt-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - hunt-net
    restart: unless-stopped

# Networks & Volumes
networks:
  hunt-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  dns_cache:
  hunt_workspaces: