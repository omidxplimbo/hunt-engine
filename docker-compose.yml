version: '3.8'

services:
  backend:
    container_name: ${CONTAINER_PREFIX:-hunt}-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    networks:
      - hunt-net
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-hunter}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-huntdb}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - HUNT_MAX_REQUEST_BODY_MB=${HUNT_MAX_REQUEST_BODY_MB:-5120}
      - USER_WORDLISTS_DIR=/data/wordlists/users
      - PROBE_BATCH_SIZE=${PROBE_BATCH_SIZE:-1000}
      - DNSX_BATCH_SIZE=${DNSX_BATCH_SIZE:-2000}
      - DNSX_THREADS=${DNSX_THREADS:-30}
      - AMASS_TIMEOUT_SECONDS=${AMASS_TIMEOUT_SECONDS:-900}
      - TRUSTED_RESOLVERS=${TRUSTED_RESOLVERS:-1.1.1.1,8.8.8.8}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - NUCLEI_ALLOW_AI_TEMPLATES=${NUCLEI_ALLOW_AI_TEMPLATES:-false}
      - NUCLEI_CUSTOM_TEMPLATES_DIR=/data/nuclei/custom
      - HUNT_NUCLEI_TIMEOUT=${HUNT_NUCLEI_TIMEOUT:-10m}
    volumes:
      - ./hunt-wordlists:/data/wordlists
      - ./custom_nuclei_templates:/data/nuclei/custom
      - hunt_workspaces:/tmp/hunt-engine
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis

  frontend:
    container_name: ${CONTAINER_PREFIX:-hunt}-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    expose:
      - "80"
    networks:
      - hunt-net
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    container_name: ${CONTAINER_PREFIX:-hunt}-nginx
    image: nginx:alpine
    network_mode: host
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/conf.d/unified.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  postgres:
    container_name: ${CONTAINER_PREFIX:-hunt}-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-hunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-huntdb}
    volumes:
      - hunt_postgres_data:/var/lib/postgresql/data
    networks:
      - hunt-net
    restart: unless-stopped

  redis:
    container_name: ${CONTAINER_PREFIX:-hunt}-redis
    image: redis:7-alpine
    volumes:
      - hunt_redis_data:/data
    networks:
      - hunt-net
    restart: unless-stopped

  dns:
    container_name: ${CONTAINER_PREFIX:-hunt}-dns
    build:
      context: ./dns
      dockerfile: Dockerfile
    network_mode: "host"
    volumes:
      - ./dns/zones:/etc/bind/zones
      - ./dns/logs:/var/log/named
      - dns_cache:/var/cache/bind
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP:-0.0.0.0}
    restart: unless-stopped

  certbot:
    container_name: ${CONTAINER_PREFIX:-hunt}-certbot
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - hunt-net
    restart: unless-stopped

networks:
  hunt-net:
    driver: bridge

volumes:
  hunt_postgres_data:
  hunt_redis_data:
  nginx_logs:
  hunt_workspaces:
  dns_cache:
