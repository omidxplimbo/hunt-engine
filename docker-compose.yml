services:
  # -----------------------------
  # 1. Backend API (Golang Engine)
  # -----------------------------
  backend:
    container_name: hunt-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports removed - only accessible through nginx reverse proxy
    expose:
      - "8080"
    environment:
      - DB_HOST=postgres
      - DB_USER=${DB_USER:-hunter}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:-huntdb}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - PROBE_BATCH_SIZE=${PROBE_BATCH_SIZE:-1000} - DNSX_BATCH_SIZE=${DNSX_BATCH_SIZE:-2000} - DNSX_THREADS=${DNSX_THREADS:-30} - AMASS_TIMEOUT_SECONDS=${AMASS_TIMEOUT_SECONDS:-900}
      - TRUSTED_RESOLVERS=${TRUSTED_RESOLVERS:-1.1.1.1,8.8.8.8,1.0.0.1,8.8.4.4}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required and must be at least 32 characters}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-} - NUCLEI_ALLOW_AI_TEMPLATES=${NUCLEI_ALLOW_AI_TEMPLATES:-false}
      - NUCLEI_CUSTOM_TEMPLATES_DIR=/data/nuclei/custom
      - HUNT_NUCLEI_TIMEOUT=${HUNT_NUCLEI_TIMEOUT:-10m}
    volumes:
      # 👇 این خط برای وردلیست‌های سفارشی اضافه شد (برای آینده)
      - ./custom_wordlists:/wordlists/custom
      - ./custom_nuclei_templates:/data/nuclei/custom
      # 👇 persist worker temp workspace for crash-safe resume
      - hunt_workspaces:/tmp/hunt-engine
      # 👇 Access Docker Socket for System Logs
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres
      - redis
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 2. Frontend Dashboard (React/Modern UI)
  # -----------------------------
  frontend:
    container_name: hunt-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Dynamic API URL based on domain
        - VITE_API_URL=/api
    # Ports removed - only accessible through nginx reverse proxy
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 3. Nginx Reverse Proxy with SSL
  # -----------------------------
  nginx:
    container_name: hunt-nginx
    image: nginx:alpine
    ports:
      - "8888:80"
      - "4443:443"
      - "4000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/nginx-init.conf:/etc/nginx/templates/init.conf.template:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
    command: >
      sh -c "
      if [ -z \"$$SERVER_IP\" ]; then
        export SERVER_IP=127.0.0.1;
      fi;
      if [ -f /etc/letsencrypt/live/$${DOMAIN_NAME:-localhost}/fullchain.pem ]; then
        envsubst '$$DOMAIN_NAME $$SERVER_IP' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf && echo 'Using SSL configuration';
      else
        envsubst '$$DOMAIN_NAME $$SERVER_IP' < /etc/nginx/templates/init.conf.template > /etc/nginx/conf.d/default.conf && echo 'Using initial configuration (SSL not yet set up)';
      fi && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - backend
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 4. DNS Server (BIND9) - Your Own DNS Server
  # -----------------------------
  dns:
    container_name: hunt-dns
    build:
      context: ./dns
      dockerfile: Dockerfile
    # Use host network mode to avoid port 53 conflict with systemd-resolved
    network_mode: "host"
    volumes:
      - ./dns/zones:/etc/bind/zones
      - ./dns/logs:/var/log/named
      - dns_cache:/var/cache/bind
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
      - SERVER_IP=${SERVER_IP:-127.0.0.1}
    restart: unless-stopped
    # Note: When using host network mode, we can't use docker networks
    # but DNS server will be directly accessible on host IP

  # -----------------------------
  # 5. Certbot for SSL Certificate Management
  # -----------------------------
  certbot:
    container_name: hunt-certbot
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - hunt-net
    restart: unless-stopped

  # -----------------------------
  # 6. Databases & Cache
  # -----------------------------
  postgres:
    container_name: hunt-postgres
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-hunter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-huntdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hunt-net
    restart: unless-stopped

  redis:
    container_name: hunt-redis
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - hunt-net
    restart: unless-stopped

# Networks & Volumes
networks:
  hunt-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
  dns_cache:
  hunt_workspaces:
