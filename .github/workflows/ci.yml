name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build backend API
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w" -o /tmp/hunt-engine-api ./cmd/server

  frontend:
    name: Frontend TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  compose-config:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate docker compose config
        env:
          DB_USER: hunter
          DB_PASSWORD: ci_postgres_password_change_me
          DB_NAME: huntdb
          JWT_SECRET: ci_jwt_secret_0123456789abcdef0123456789abcdef
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
          VIRUSTOTAL_API_KEY: ""
          DNSX_BATCH_SIZE: "2000"
          DNSX_THREADS: "30"
          AMASS_TIMEOUT_SECONDS: "900"
          DOMAIN_NAME: localhost
          SERVER_IP: 127.0.0.1
        run: docker compose config
