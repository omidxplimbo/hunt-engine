services:
  postgres:
    image: postgres:16
    container_name: hunt-prod-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    networks:
      - hunt-prod-net

  redis:
    image: redis:7-alpine
    container_name: hunt-prod-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prod_redis_data:/data
    networks:
      - hunt-prod-net

  backend:
    image: ghcr.io/omidxplimbo/hunt-engine-backend:${HUNT_IMAGE_TAG}
    container_name: hunt-prod-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./data:/tmp/hunt-engine
      - ./wordlists:/data/wordlists
      - ./reports:/data/reports
    ports:
      - "${BACKEND_PORT}:8080"
    networks:
      - hunt-prod-net

  frontend:
    image: ghcr.io/omidxplimbo/hunt-engine-frontend:${HUNT_IMAGE_TAG}
    container_name: hunt-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - hunt-prod-net

volumes:
  prod_postgres_data:
  prod_redis_data:

networks:
  hunt-prod-net:
    name: hunt-prod-net
